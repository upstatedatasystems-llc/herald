name: Herald CI Workflow

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test & Lint (Python)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: herald_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Lint with Ruff
        run: |
          ruff check herald/ apps/ tests/

      - name: Run Alembic migrations against PostgreSQL
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/herald_test
        run: |
          alembic upgrade head

      - name: Run unit & integration tests
        env:
          HERALD_TEST_DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/herald_test
        run: |
          pytest -v tests/ --cov=herald --cov=apps

      - name: Run Kokoro TTS smoke test (mock mode)
        run: |
          python scripts/smoke_test.py --mock-if-missing
