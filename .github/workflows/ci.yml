name: Herald CI Workflow

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test & Lint (Python)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Lint with Ruff
        run: |
          ruff check herald/ apps/ tests/

      - name: Run unit & integration tests
        run: |
          pytest -v tests/ --cov=herald --cov=apps

      - name: Run Kokoro TTS smoke test (mock mode)
        run: |
          python scripts/smoke_test.py --mock-if-missing
