services:
  postgres:
    image: postgres:16-alpine
    container_name: herald-postgres
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 1024M
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-herald}
      POSTGRES_USER: ${POSTGRES_USER:-herald}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-herald_secure_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - herald-backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-herald} -d ${POSTGRES_DB:-herald}"]
      interval: 10s
      timeout: 5s
      retries: 5

  herald-migration:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    container_name: herald-migration
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    networks:
      - herald-backend

  kokoro:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:v0.7.1
    container_name: herald-kokoro
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 2048M
    networks:
      - herald-backend
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8880/v1/models || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 30s

  herald-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    container_name: herald-worker
    restart: unless-stopped
    dns:
      - ${HERALD_DNS_PRIMARY:-1.1.1.1}
      - ${HERALD_DNS_SECONDARY:-8.8.8.8}
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 1024M
    depends_on:
      postgres:
        condition: service_healthy
      herald-migration:
        condition: service_completed_successfully
      kokoro:
        condition: service_healthy
    env_file:
      - .env
    environment:
      HERALD_WORK_DIR: /data/herald
      PYTHONUNBUFFERED: "1"
    volumes:
      - work_data:/data/herald
      - ./logs:/app/logs
    networks:
      - herald-backend

  telegram-bot:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    container_name: herald-telegram-bot
    restart: unless-stopped
    dns:
      - ${HERALD_DNS_PRIMARY:-1.1.1.1}
      - ${HERALD_DNS_SECONDARY:-8.8.8.8}
    command: ["python", "-u", "-m", "apps.telegram_bot.main"]
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      postgres:
        condition: service_healthy
      herald-migration:
        condition: service_completed_successfully
      kokoro:
        condition: service_healthy
    env_file:
      - .env
    environment:
      HERALD_WORK_DIR: /data/herald
      PYTHONUNBUFFERED: "1"
    volumes:
      - work_data:/data/herald
      - ./logs:/app/logs
    networks:
      - herald-backend

networks:
  herald-backend:
    driver: bridge
    internal: false

volumes:
  postgres_data:
  work_data:
